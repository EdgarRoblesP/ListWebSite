<!--
  PANTALLA DE TAREAS
  ---------------------------------------------------------------------------
  Copia literal de la antigua app.component.html, con un unico anadido: la
  fila .session-bar de arriba, que muestra quien esta conectado y permite
  cerrar la sesion.
-->
<div class="app-container">

  <main class="main-card">

    <!-- NUEVO: barra de sesion. Antes no existia porque no habia login. -->
    <div class="session-bar">
      <span class="session-user">
        Sesion de <strong>{{ currentUser()?.name }}</strong>
      </span>
      <button type="button" class="btn-logout" (click)="onLogout()">
        Cerrar sesion
      </button>
    </div>

    <header class="app-header">
      <div>
        <h1 class="header-title">{{ appTitle }}</h1>
        <p class="header-subtitle">{{ appSubtitle }}</p>
      </div>
      <app-task-counter></app-task-counter>
    </header>

    <section class="section-input">
      <app-task-input></app-task-input>
    </section>

    <div class="controls-row">
      <div class="section-heading">
        <h2>Mis Tareas</h2>
      </div>
      <app-task-filter></app-task-filter>
    </div>

    <section class="section-list">
      <app-task-list></app-task-list>
    </section>
  </main>
</div>
